<svg xmlns="http://www.w3.org/2000/svg" width="440" height="252" viewBox="0 0 440 252" fill="none" role="img" aria-label="VN Data Job Market (Vietnam-Data-Job-Market-Analysis): Weekly ETL across six Vietnamese job boards, modelled Bronze → Silver → Gold in DuckDB with CDC.">
<title>VN Data Job Market (Vietnam-Data-Job-Market-Analysis): Weekly ETL across six Vietnamese job boards, modelled Bronze → Silver → Gold in DuckDB with CDC.</title>
<style>.tw{animation:tw 5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}.sweep{animation:sw 9s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-200px)}45%,100%{transform:translateX(640px)}}</style>
<defs>
<radialGradient id="spot-p1" cx="0.0" cy="0.0" r="0.9"><animate attributeName="cx" values="0.0;0.5;0.0" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><stop offset="0" stop-color="#2E2E2E"/><stop offset=".45" stop-color="#121212"/><stop offset="1" stop-color="#050505"/></radialGradient>
