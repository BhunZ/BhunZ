<clipPath id="cc-p1"><rect width="440" height="252" rx="14"/></clipPath></defs>
<g clip-path="url(#cc-p1)"><rect class="sweep" style="animation-delay:1.3s" x="0" y="0" width="160" height="252" fill="url(#sw-p1)" transform="skewX(-20)"/></g>
