<clipPath id="clip-p1"><rect width="440" height="252" rx="14"/></clipPath>
</defs>
<g clip-path="url(#clip-p1)"><rect width="440" height="252" fill="url(#spot-p1)"/><rect width="440" height="252" filter="url(#grain-p1)"/></g>
