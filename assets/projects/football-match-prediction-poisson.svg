<svg xmlns="http://www.w3.org/2000/svg" width="440" height="252" viewBox="0 0 440 252" fill="none" role="img" aria-label="Poisson Football (football-match-prediction-poisson): Premier League scorelines modelled as full probability distributions with a Poisson model. 2 stars.">
<title>Poisson Football (football-match-prediction-poisson): Premier League scorelines modelled as full probability distributions with a Poisson model. 2 stars.</title>
<style>.tw{animation:tw 5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}.sweep{animation:sw 9s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-200px)}45%,100%{transform:translateX(640px)}}</style>
