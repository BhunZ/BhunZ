<svg xmlns="http://www.w3.org/2000/svg" width="440" height="252" viewBox="0 0 440 252" fill="none" role="img" aria-label="Binance Market Pipeline (binance-market-pipeline): Batch (Airflow → dbt) and streaming (Kafka) views of one market, reconciled minute by minute.">
<title>Binance Market Pipeline (binance-market-pipeline): Batch (Airflow → dbt) and streaming (Kafka) views of one market, reconciled minute by minute.</title>
<style>.tw{animation:tw 5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}.sweep{animation:sw 9s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-200px)}45%,100%{transform:translateX(640px)}}</style>
<defs>
<radialGradient id="spot-p2" cx="0.0" cy="0.0" r="0.9"><animate attributeName="cx" values="0.0;0.5;0.0" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><stop offset="0" stop-color="#2E2E2E"/><stop offset=".45" stop-color="#121212"/><stop offset="1" stop-color="#050505"/></radialGradient>
<filter id="grain-p2" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
<clipPath id="clip-p2"><rect width="440" height="252" rx="14"/></clipPath>
</defs>
<g clip-path="url(#clip-p2)"><rect width="440" height="252" fill="url(#spot-p2)"/><rect width="440" height="252" filter="url(#grain-p2)"/></g>
<rect x=".5" y=".5" width="439" height="251" rx="13.5" stroke="#2A2A2A"/>

<defs><linearGradient id="sw-p2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="cc-p2"><rect width="440" height="252" rx="14"/></clipPath></defs>
<g clip-path="url(#cc-p2)"><rect class="sweep" style="animation-delay:2.6s" x="0" y="0" width="160" height="252" fill="url(#sw-p2)" transform="skewX(-20)"/></g>
